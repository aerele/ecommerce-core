---
name: Feature Request
description: Suggest an idea to improve Ecommerce Core
labels: ["feature-request"]

body:
  - type: markdown
    attributes:
      value: |
        Welcome to the Ecommerce Core issue tracker! Before submitting a request, please consider the following:

        1. This tracker should only be used to report bugs and request features / enhancements to Ecommerce Core
            - For questions and general support, use the [forum](https://discuss.frappe.io) to get inputs from the open source community.
        2. Use the search function before creating a new issue. Duplicates will be closed and directed to
          the original discussion.
        3. When making a feature request, make sure to be as verbose as possible. The better you convey your message, the greater the drive to make it happen.

        Please keep in mind that Ecommerce Core is the shared foundation for all connector apps, so features here
        should benefit multiple integrations. Provider-specific behaviour belongs in the connector app itself.

  - type: textarea
    id: problem-info
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of what the problem is. Eg. I'm always frustrated when [...]
      placeholder: Please provide as much information as possible.

  - type: textarea
    id: solution-info
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.

  - type: textarea
    id: alternatives-info
    attributes:
      label: Describe the alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.

  - type: textarea
    id: additional-info
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the feature request here.
