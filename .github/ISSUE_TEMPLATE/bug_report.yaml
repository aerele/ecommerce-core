---
name: Bug Report
description: Report a bug encountered while using Ecommerce Core
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Welcome to the Ecommerce Core issue tracker! Before creating an issue, please consider the following:

        1. This tracker should only be used to report bugs and request features / enhancements to Ecommerce Core
            - For questions and general support, use the [forum](https://discuss.frappe.io) to get inputs from the open source community.
        2. When making a bug report, make sure you provide all required information. The easier it is for
           maintainers to reproduce, the faster it'll be fixed.
        3. If you think you know what the reason for the bug is, share it with us. Maybe put in a PR 😉

  - type: textarea
    id: bug-info
    attributes:
      label: Information about bug
      description: Also tell us, what did you expect to happen? If applicable, add screenshots to help explain your problem.
      placeholder: Please provide as much information as possible.
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Select the affected module of Ecommerce Core.
      multiple: true
      options:
        - Ecommerce Item
        - Ecommerce Integration Log
        - Controllers (Settings, Inventory, Scheduling, Customer)
        - Utils (Taxation, Price List, Address Mapping, Naming Series)
        - Client Scripts
        - other
    validations:
      required: true

  - type: textarea
    id: exact-version
    attributes:
      label: Version
      description: Share exact version numbers of the apps you are using, including any connector app built on Ecommerce Core.
      placeholder: |
        Frappe version -
        ERPNext version -
        Ecommerce Core version -
        Connector app and version (Unicommerce, Medusa, ...) -
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - docker
        - easy-install
        - manual install
        - FrappeCloud
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output / Stack trace / Full Error Message.
      description: Please copy and paste any relevant log output. This will be automatically formatted.
      render: shell
